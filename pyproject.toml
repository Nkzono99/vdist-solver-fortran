[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=68",
  "wheel",
  "fpm",
]

[project]
name = "vdist-solver-fortran"
version = "1.5.0"

requires-python = ">=3.7"

description = "Wrapper of velocity distribution solver written in Fortran"
readme = "README.md"

keywords = []

authors = [{ name = "Nkzono99", email = "j-nakazono@stu.kobe-u.ac.jp" }]

maintainers = [{ name = "Nkzono99", email = "j-nakazono@stu.kobe-u.ac.jp" }]

license = { file = "LICENSE" }

dependencies = [
  "f90nml",
  "emout >= 2.0.4",
  "numpy",
  "scipy",
  "tqdm",
  "jupyter",
  "ipykernel",
  "ipywidgets",
]

classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
mpi = [
  "mpi4py",
]

[project.urls]
Repository = "https://github.com/Nkzono99/vdist-solver-fortran.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
vdsolverf = ["libvdist-solver-fortran.*"]
