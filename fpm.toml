name = "vdist-solver-fortran"
version = "1.7.1"
license = "Apache License Version 2.0"
author = "Nkzono99"
maintainer = "210x218x@stu.kobe-u.ac.jp"
copyright = "Copyright 2024, Nkzono99"

[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
external-modules = ["mpi"] # used only by the VDSOLVERF_MPI executable build

[install]
library = true

[library]
# `make install` installs compiler-specific .mod files under ./include.
# They must never shadow the modules generated for the current build flags.
include-dir = []

[preprocess.cpp]
suffixes = ["f90", "F90"]

[[executable]]
name = "vdsolverf-batch"
source-dir = "app"
main = "vdsolverf_batch.f90"

[dependencies]
futils = { git = "https://github.com/Nkzono99/futils" }
finbound = { git = "https://github.com/Nkzono99/finbound" }
forbear = { git = "https://github.com/szaghi/forbear.git" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
